<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Imię Nazwisko klasa" />
    <title>Nauka 6 – dodaj produkt</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Dodaj produkt</h1>
    <form id="formularz">
      <label for="nazwa">Nazwa</label>
      <input id="nazwa" name="nazwa" type="text" />
      <label for="cena">Cena</label>
      <input id="cena" name="cena" type="number" step="0.01" />
      <button type="submit">Dodaj</button>
    </form>
    <p id="wynik"></p>
    <table>
      <thead>
        <tr>
          <th>Nazwa</th>
          <th>Cena</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <footer><p>Igor Wickowski 5i</p></footer>
  </body>
</html>
